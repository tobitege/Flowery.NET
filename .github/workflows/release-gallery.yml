name: Release Gallery

# MANUAL TRIGGER ONLY - Creates a Gallery-only release (no NuGet publish)
# Automatically determines version from library + increments gallery suffix
# Tags from avalonia12: v2.0.0-gallery.1, v2.0.0-gallery.2, etc.
# Tags from alpha: v2.0.0-alpha-gallery.1, v2.0.0-alpha-gallery.2, etc.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to release from'
        required: true
        type: choice
        options:
          - avalonia12
          - main
          - alpha
        default: avalonia12
      description:
        description: 'Optional: What changed in this release?'
        required: false
        type: string

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      lib_version: ${{ steps.version.outputs.lib_version }}
      gallery_suffix: ${{ steps.version.outputs.gallery_suffix }}
      tag: ${{ steps.version.outputs.tag }}
      display_version: ${{ steps.version.outputs.display_version }}
      branch: ${{ steps.version.outputs.branch }}
      sha: ${{ steps.version.outputs.sha }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0  # Need full history for tags

      # The branch is resolved to a commit once here. The build jobs and the tag use that commit, so a push to the
      # branch during the run cannot mix commits in one release.
      - name: Determine version
        id: version
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          case "$BRANCH" in
            avalonia12|main|alpha) ;;
            *) echo "::error::Unsupported release branch: $BRANCH"; exit 1 ;;
          esac

          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "Branch: $BRANCH"

          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "Commit: $SHA"

          # Get library version from shared build metadata
          LIB_VERSION=$(python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse('Directory.Build.props').getroot()
          for property_group in root.findall('PropertyGroup'):
              version = property_group.find('Version')
              if version is not None and version.text and version.text.strip():
                  print(version.text.strip())
                  break
          else:
              sys.exit('Version not found in Directory.Build.props')
          PY
          )
          if [ -z "$LIB_VERSION" ]; then
            echo "::error::Version not found in Directory.Build.props"
            exit 1
          fi
          echo "lib_version=$LIB_VERSION" >> $GITHUB_OUTPUT
          echo "Library version: $LIB_VERSION"

          # Build tag pattern based on branch
          if [ "$BRANCH" = "avalonia12" ] || [ "$BRANCH" = "main" ]; then
            # Default release branches: v2.0.0-gallery.N
            TAG_PREFIX="v${LIB_VERSION}-gallery."
            IS_PRERELEASE="false"
          else
            # Other branches (e.g., alpha): v2.0.0-alpha-gallery.N
            TAG_PREFIX="v${LIB_VERSION}-${BRANCH}-gallery."
            IS_PRERELEASE="true"
          fi
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

          # Get the highest existing suffix, default to 0 if none exist
          HIGHEST=$(git tag -l "${TAG_PREFIX}*" | sed "s/${TAG_PREFIX}//" | sort -n | tail -1)

          if [ -z "$HIGHEST" ]; then
            NEXT_SUFFIX=1
            echo "First gallery release for ${TAG_PREFIX%%.}"
          else
            NEXT_SUFFIX=$((HIGHEST + 1))
            echo "Existing gallery releases found, highest suffix: $HIGHEST"
          fi

          echo "gallery_suffix=$NEXT_SUFFIX" >> $GITHUB_OUTPUT

          TAG="${TAG_PREFIX}${NEXT_SUFFIX}"
          if [ "$BRANCH" = "avalonia12" ] || [ "$BRANCH" = "main" ]; then
            DISPLAY="${LIB_VERSION}-gallery.${NEXT_SUFFIX}"
          else
            DISPLAY="${LIB_VERSION}-${BRANCH}-gallery.${NEXT_SUFFIX}"
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "display_version=$DISPLAY" >> $GITHUB_OUTPUT

          echo "Will create release: $TAG (prerelease: $IS_PRERELEASE)"

  build-gallery:
    needs: prepare
    uses: ./.github/workflows/_build-gallery.yml
    with:
      branch: ${{ needs.prepare.outputs.sha }}
    permissions:
      contents: read

  publish:
    needs: [prepare, build-gallery]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: ./release-artifacts

      - name: Collect artifacts
        run: |
          mkdir -p ./final
          find ./release-artifacts -name "*.zip" -exec cp {} ./final/ \;
          find ./release-artifacts -name "*.tar.gz" -exec cp {} ./final/ \;
          find ./release-artifacts -name "*.apk" -exec cp {} ./final/ \;
          echo "=== Release artifacts ==="
          ls -la ./final/

      - name: Create checksums
        working-directory: ./final
        run: |
          sha256sum -- * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt ./SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Signed build provenance for every release asset, verifiable with `gh attestation verify`.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: './final/*'

      - name: Create and push tag for the built commit
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$RELEASE_TAG" "$SOURCE_SHA"
          git push origin "refs/tags/$RELEASE_TAG"
          echo "Created tag: $RELEASE_TAG on $SOURCE_SHA"

      - name: Build release notes
        env:
          RELEASE_DESCRIPTION: ${{ inputs.description }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          {
            # Pre-release warning (if applicable)
            if [ "${{ needs.prepare.outputs.is_prerelease }}" = "true" ]; then
              echo "> **Pre-release** from \`${{ needs.prepare.outputs.branch }}\` branch - not for production use."
              echo ""
            fi

            echo "## Gallery Demo App Update"
            echo ""

            # Optional description (if provided)
            if [ -n "$RELEASE_DESCRIPTION" ]; then
              echo "### What's Changed"
              echo ""
              printf '%s\n' "$RELEASE_DESCRIPTION"
              echo ""
            fi

            echo "This is a **Gallery-only release** containing updates to the demo application."
            echo "The underlying Flowery.NET library version remains at **${{ needs.prepare.outputs.lib_version }}**."
            echo ""
            echo "### Downloads"
            echo ""
            echo "Self-contained executables - no .NET installation required!"
            echo ""
            echo "| Platform | Download |"
            echo "|----------|----------|"
            echo "| Windows x64 | \`Flowery.Gallery-Windows-x64.zip\` |"
            echo "| Windows ARM64 | \`Flowery.Gallery-Windows-arm64.zip\` |"
            echo "| Linux x64 | \`Flowery.Gallery-Linux-x64.tar.gz\` |"
            echo "| Linux ARM64 | \`Flowery.Gallery-Linux-arm64.tar.gz\` |"
            echo "| macOS ARM64 | \`Flowery.Gallery-macOS-arm64.tar.gz\` |"
            echo "| macOS x64 | \`Flowery.Gallery-macOS-x64.tar.gz\` |"
            echo "| Android arm | \`Flowery.Gallery-Android-arm.apk\` |"
            echo "| Android arm64 | \`Flowery.Gallery-Android-arm64.apk\` |"
            echo "| Android x86 | \`Flowery.Gallery-Android-x86.apk\` |"
            echo "| Android x64 | \`Flowery.Gallery-Android-x64.apk\` |"
            echo "| Browser (WebAssembly) | \`Flowery.Gallery-Browser.zip\` |"
            echo ""
            echo "The Browser zip contains a static website. Serve the extracted folder with any web server; opening \`index.html\` from disk does not work."
            echo ""
            echo "### Verify downloads"
            echo ""
            echo "This workflow built every asset above and attested its build provenance. To check that a file comes from this repository and release build:"
            echo ""
            echo '```'
            echo "gh attestation verify <file> --repo ${{ github.repository }}"
            echo '```'
            echo ""
            echo "\`SHA256SUMS.txt\` lists the SHA-256 checksum of every asset; check all of them with \`sha256sum -c SHA256SUMS.txt\`, or one file in PowerShell with \`Get-FileHash <file>\`."
            echo ""
            echo "Source commit: $SOURCE_SHA"
            echo ""
            echo "---"
            echo ""
            echo "> For the NuGet package, see the latest library release: [v${{ needs.prepare.outputs.lib_version }}](https://github.com/${{ github.repository }}/releases/tag/v${{ needs.prepare.outputs.lib_version }})"
          } > release_notes.md

          echo "=== Release Notes ==="
          cat release_notes.md

      - name: Load release notes
        id: release_body
        run: |
          {
            echo 'body<<EOF'
            cat release_notes.md
            echo ''
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "Gallery ${{ needs.prepare.outputs.display_version }}"
          files: ./final/*
          body: ${{ steps.release_body.outputs.body }}
          generate_release_notes: true
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## Gallery Release Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** ${{ needs.prepare.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ needs.prepare.outputs.branch }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ needs.prepare.outputs.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Library Version:** ${{ needs.prepare.outputs.lib_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Gallery Suffix:** ${{ needs.prepare.outputs.gallery_suffix }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Pre-release:** ${{ needs.prepare.outputs.is_prerelease }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Release:** ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
