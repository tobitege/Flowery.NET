name: CI Build

# Builds and runs the headless tests on every commit and pull request
# Does NOT publish anything - just verification

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - alpha
      - avalonia12
  pull_request:
    branches:
      - main
      - alpha
      - avalonia12

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-library:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build Library
        run: dotnet build Flowery.NET/Flowery.NET.csproj -c ${{ matrix.configuration }}

      - name: Run Tests
        run: dotnet test Flowery.NET.Tests/Flowery.NET.Tests.csproj -c ${{ matrix.configuration }}

      - name: Run documentation tests
        run: python3 -B -m unittest discover -s Utils -p test_documentation.py

  build-gallery:
    strategy:
      matrix:
        include:
          - os: windows-2025-vs2026
            rid: win-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build Gallery Desktop
        shell: bash
        run: |
          dotnet publish Flowery.NET.Gallery.Desktop/Flowery.NET.Gallery.Desktop.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -o ./publish
