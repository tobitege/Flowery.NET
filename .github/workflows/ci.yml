name: CI Build

# Builds on every commit to verify everything compiles
# Does NOT publish anything - just verification

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - alpha
      - avalonia12
  pull_request:
    branches:
      - main
      - alpha
      - avalonia12

permissions:
  contents: read

jobs:
  build-library:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'

      - name: Build Library
        run: dotnet build Flowery.NET/Flowery.NET.csproj -c Release

      - name: Build Tests
        run: dotnet build Flowery.NET.Tests/Flowery.NET.Tests.csproj -c Release

  build-gallery:
    strategy:
      matrix:
        include:
          - os: windows-2025-vs2026
            rid: win-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '9.0.x'

      - name: Build Gallery Desktop
        shell: bash
        run: |
          dotnet publish Flowery.NET.Gallery.Desktop/Flowery.NET.Gallery.Desktop.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -o ./publish
