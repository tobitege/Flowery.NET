name: Dependency Security

# Changes to the documentation alone change no dependency and skip it; keep the documentation
# paths in sync with ci.yml and docs.yml.

on:
  push:
    branches: [avalonia12]
    paths-ignore: &documentation
      - '**/*.md'
      - llms-static/**
      - Utils/check_characters.py
      - Utils/docs_manifest.py
      - Utils/generate_docs.py
      - Utils/generate_site.py
      - Utils/site_*
      - Utils/test_check_characters.py
      - Utils/test_documentation.py
  pull_request:
    branches: [avalonia12]
    paths-ignore: *documentation
  schedule:
    - cron: '15 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    # macOS can restore all hosts, including the iOS project.
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install restore workloads
        run: dotnet workload install android ios wasm-tools

      - name: Audit every C# project, including transitive packages
        shell: pwsh
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: |
          $projects = @(git ls-files -- '*.csproj')
          if ($LASTEXITCODE -ne 0 -or $projects.Count -eq 0) {
              throw 'No tracked C# projects found.'
          }
          foreach ($project in $projects) {
              $restoreArgs = @(
                  'restore', $project, '--force-evaluate',
                  "-p:Configuration=$env:CONFIGURATION",
                  '-p:NuGetAudit=true', '-p:NuGetAuditMode=all',
                  '-warnaserror:NU1900,NU1901,NU1902,NU1903,NU1904,NU1905'
              )
              dotnet @restoreArgs
              if ($LASTEXITCODE -ne 0) { throw "Dependency audit failed for $project." }
          }

      - name: Preserve resolved Release dependencies for submission
        if: >-
          matrix.configuration == 'Release' &&
          github.event_name != 'pull_request' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resolved-nuget-dependencies
          path: obj/**/project.assets.json
          if-no-files-found: error
          retention-days: 1

  dependency-submission:
    needs: audit
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: resolved-nuget-dependencies
          path: obj

      - name: Rebase restored project paths to the submission workspace
        shell: pwsh
        run: |
          $projects = @{}
          foreach ($project in (git ls-files -- '*.csproj')) {
              $projects[[IO.Path]::GetFileNameWithoutExtension($project)] = Join-Path $env:GITHUB_WORKSPACE $project
          }
          foreach ($file in (Get-ChildItem -LiteralPath obj -Filter project.assets.json -Recurse -File)) {
              $assets = Get-Content -LiteralPath $file.FullName -Raw | ConvertFrom-Json -AsHashtable
              $restore = $assets.project.restore
              $projectPath = $projects[$restore.projectName]
              if (-not $projectPath) { throw "Unknown restored project in $file." }
              $restore.projectPath = $projectPath
              $restore.projectUniqueName = $projectPath
              $restore.outputPath = $file.DirectoryName
              $assets | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath $file.FullName -Encoding utf8
          }

      - name: Submit direct and transitive NuGet dependencies
        uses: advanced-security/component-detection-dependency-submission-action@a02aeda7a175ad4dd38a13c4d3ff2df9da8f2cf0 # v0.2.0
        with:
          detectorsCategories: NuGet
          fail-on-empty: true
