name: Build Gallery (Reusable)

# Internal reusable workflow - called by release.yml and release-gallery.yml
# Not meant to be triggered directly

on:
  workflow_call:
    inputs:
      branch:
        description: 'Branch to build from'
        required: false
        type: string
        default: 'main'

jobs:
  build-desktop:
    strategy:
      matrix:
        include:
          - os: windows-2025-vs2026
            rid: win-x64
            artifact_name: Flowery.Gallery-Windows-x64

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Publish Gallery App
        shell: bash
        run: |
          dotnet publish Flowery.NET.Gallery.Desktop/Flowery.NET.Gallery.Desktop.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -o ./publish

      - name: Zip Windows artifact
        if: matrix.os == 'windows-2025-vs2026'
        run: Compress-Archive -Path ./publish/* -DestinationPath ./${{ matrix.artifact_name }}.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ./${{ matrix.artifact_name }}.zip
          if-no-files-found: ignore

  build-android:
    strategy:
      matrix:
        include:
          - rid: android-arm
            artifact_name: Flowery.Gallery-Android-arm
          - rid: android-arm64
            artifact_name: Flowery.Gallery-Android-arm64
          - rid: android-x86
            artifact_name: Flowery.Gallery-Android-x86
          - rid: android-x64
            artifact_name: Flowery.Gallery-Android-x64

    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Resolve Android target framework
        id: android
        shell: pwsh
        run: |
          $project = 'Flowery.NET.Gallery.Android/Flowery.NET.Gallery.Android.csproj'
          $projectXml = [xml](Get-Content -LiteralPath $project -Raw)
          $targetFramework = $projectXml.Project.PropertyGroup.TargetFramework | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($targetFramework)) {
              throw "TargetFramework not found in $project."
          }
          "target_framework=$targetFramework" >> $env:GITHUB_OUTPUT

      - name: Build Android APK
        run: |
          dotnet publish Flowery.NET.Gallery.Android/Flowery.NET.Gallery.Android.csproj \
            -c Release \
            -f ${{ steps.android.outputs.target_framework }} \
            -r ${{ matrix.rid }} \
            -p:AndroidPackageFormat=apk \
            -o ./android-publish/${{ matrix.rid }}

      - name: Collect Android APK
        shell: bash
        run: |
          mkdir -p ./android-artifacts
          output_dir="./android-publish/${{ matrix.rid }}"
          apk=$(find "$output_dir" -name "*-Signed.apk" | head -n 1)
          if [ -z "$apk" ]; then
            apk=$(find "$output_dir" -name "*.apk" | head -n 1)
          fi
          if [ -z "$apk" ]; then
            echo "::error::No Android APK was produced."
            exit 1
          fi
          cp "$apk" ./android-artifacts/${{ matrix.artifact_name }}.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ./android-artifacts/${{ matrix.artifact_name }}.apk
          if-no-files-found: error
