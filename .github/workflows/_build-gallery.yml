name: Build Gallery (Reusable)

# Internal reusable workflow - called by release.yml and release-gallery.yml
# Not meant to be triggered directly

on:
  workflow_call:
    inputs:
      branch:
        description: 'Branch to build from'
        required: false
        type: string
        default: 'main'

jobs:
  build-desktop:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact_name: Flowery.Gallery-Windows-x64

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish Gallery App
        shell: bash
        run: |
          dotnet publish Flowery.NET.Gallery.Desktop/Flowery.NET.Gallery.Desktop.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -o ./publish

      - name: Zip Windows artifact
        if: matrix.os == 'windows-latest'
        run: Compress-Archive -Path ./publish/* -DestinationPath ./${{ matrix.artifact_name }}.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ./${{ matrix.artifact_name }}.zip
          if-no-files-found: ignore

  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Resolve Android target framework
        id: android
        shell: pwsh
        run: |
          $project = 'Flowery.NET.Gallery.Android/Flowery.NET.Gallery.Android.csproj'
          $projectXml = [xml](Get-Content -LiteralPath $project -Raw)
          $targetFramework = $projectXml.Project.PropertyGroup.TargetFramework | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($targetFramework)) {
              throw "TargetFramework not found in $project."
          }
          "target_framework=$targetFramework" >> $env:GITHUB_OUTPUT

      - name: Build Android APK
        run: |
          dotnet publish Flowery.NET.Gallery.Android/Flowery.NET.Gallery.Android.csproj \
            -c Release \
            -f ${{ steps.android.outputs.target_framework }} \
            -p:AndroidPackageFormat=apk

      - name: Collect Android APK
        shell: bash
        run: |
          mkdir -p ./android-artifacts
          output_dir="./bin/Release/Flowery.NET.Gallery.Android/${{ steps.android.outputs.target_framework }}/publish"
          apk=$(find "$output_dir" -name "*-Signed.apk" | head -n 1)
          if [ -z "$apk" ]; then
            apk=$(find "$output_dir" -name "*.apk" | head -n 1)
          fi
          if [ -z "$apk" ]; then
            echo "::error::No Android APK was produced."
            exit 1
          fi
          cp "$apk" ./android-artifacts/Flowery.Gallery-Android.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: Flowery.Gallery-Android
          path: ./android-artifacts/Flowery.Gallery-Android.apk
          if-no-files-found: error
