name: CodeQL

on:
  push:
    branches:
      - main
      - alpha
      - avalonia12
  pull_request:
    branches:
      - main
      - alpha
      - avalonia12
  schedule:
    - cron: '32 3 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          dependency-caching: true

      - name: Build library for CodeQL extraction
        run: dotnet build Flowery.NET/Flowery.NET.csproj -c Release

      - name: Build tests for CodeQL extraction
        run: dotnet build Flowery.NET.Tests/Flowery.NET.Tests.csproj -c Release

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: /language:${{ matrix.language }}
