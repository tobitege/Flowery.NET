version: 2
updates:
  - package-ecosystem: "nuget"
    # The native checks project is not included in the root solution.
    directories:
      - "/"
      - "/Flowery.NET.Tests.Native"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    groups:
      # Avalonia packages must move together across all application/test hosts.
      avalonia:
        patterns:
          - "Avalonia"
          - "Avalonia.*"
      avalonia-security:
        applies-to: security-updates
        patterns:
          - "Avalonia"
          - "Avalonia.*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
